services:
  postgres:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Les .sql de ce dossier sont joués une seule fois, à la création du volume.
      - ./engine/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      dockerfile: engine/Dockerfile
    environment:
      # URLs internes au réseau Docker (services joignables par leur nom).
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # --- Kit de survie du rush : concurrence + rate-limit CONSERVATEUR (éditable) ---
      CELERY_CONCURRENCY: "8"          # workers : hosts DISTINCTS en parallèle
      RL_GLOBAL_RPS: "5"               # cap global req/s (egress Python)
      RL_FILIALE_RPS: "2"              # cap req/s par filiale/infra
      RL_GLOBAL_MAX_HOSTS: "4"         # hosts distincts simultanés (global)
      RL_FILIALE_MAX_HOSTS: "1"        # hosts simultanés par filiale (ne pas marteler)
      RECON_RATE_LIMIT: "5"            # req/s/host des binaires recon (httpx/katana)
      # RECON_PROXY: "http://partenaire-proxy-rotatif:8080"  # egress IPs tournantes (recon)
      # --- Recon TIÉRÉE (éditable) ---
      ENUMERATE_SUBDOMAINS: "${ENUMERATE_SUBDOMAINS:-0}"  # 0=off (liste déjà exhaustive) ; 1=subfinder par host
      SHALLOW_CRAWL_DEPTH: "1"         # TIER1 : profondeur de crawl shallow (0-1)
      SEUIL_DEEP: "5"                  # TIER2 : score shallow mini pour promouvoir en deep
      SEUIL_DEEP_SURFACE: "20"         # TIER2 : ou surface (nb URLs) mini
      MAX_DEEP_HOSTS: "10"             # TIER2 : plafond de hosts deep-traités / fenêtre
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # --- Dashboard de chasse (Tier 4) : LIT leads, ÉCRIT leads_statut. Réutilise l'image
  # worker (mêmes deps, aucun build front). Publié sur 127.0.0.1 UNIQUEMENT par défaut :
  # accès via tunnel SSH (ssh -L 8080:localhost:8080 root@<vps>). Le board porte la carte
  # d'attaque d'un périmètre bancaire -> pas d'IP publique en clair sans raison.
  board:
    build:
      context: .
      dockerfile: engine/Dockerfile
    command: ["python", "-m", "engine.board"]
    environment:
      # Rôle SELECT-only sur targets/leads + INSERT/UPDATE sur leads_statut (voir README).
      # À défaut de rôle dédié, retombe sur le compte applicatif.
      DATABASE_URL: postgresql://${BOARD_DB_USER:-${POSTGRES_USER}}:${BOARD_DB_PASS:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB}
      BOARD_PORT: "8080"
      BOARD_EXPOSE: "${BOARD_EXPOSE:-0}"     # 0=localhost/tunnel ; 1=0.0.0.0 (login déjà obligatoire)
      # Login OBLIGATOIRE (board partagé, ≥2 comptes). Vide -> le board refuse de démarrer.
      BOARD_ACCOUNTS: "${BOARD_ACCOUNTS:-}"  # 'alice:passA,bob:passB'
      BOARD_USER: "${BOARD_USER:-}"          # (legacy, compte unique optionnel)
      BOARD_PASS: "${BOARD_PASS:-}"
    ports:
      # 127.0.0.1 par défaut. Pour exposer : BOARD_BIND_HOST=0.0.0.0 + BOARD_EXPOSE=1 + creds.
      - "${BOARD_BIND_HOST:-127.0.0.1}:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
